name: Build & Push Docker Images

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/zestcommerce841428-png/milobolo-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SIGNALING_URL=https://chat.videodownloaders.cloud
            NEXT_PUBLIC_TURN_URL=turn:chat.videodownloaders.cloud:3478
            NEXT_PUBLIC_TURN_USERNAME=milobolo
            NEXT_PUBLIC_TURN_CREDENTIAL=${{ secrets.NEXT_PUBLIC_TURN_CREDENTIAL }}
            NEXT_PUBLIC_R2_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
            NEXT_PUBLIC_SITE_URL=https://chat.videodownloaders.cloud
            NEXT_PUBLIC_CONTACT_EMAIL=admin@api.zestcommerce.in
            NEXT_PUBLIC_GA_ID=
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=

      - name: Build and push signaling
        uses: docker/build-push-action@v5
        with:
          context: ./signaling
          push: true
          tags: ghcr.io/zestcommerce841428-png/milobolo-signaling:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
