name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-frontend:
    name: Lint & Type Check (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_SIGNALING_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_TURN_URL: turn:localhost:3478
          NEXT_PUBLIC_TURN_USERNAME: placeholder
          NEXT_PUBLIC_TURN_CREDENTIAL: placeholder
          NEXT_PUBLIC_R2_PUBLIC_URL: http://localhost
          NEXT_PUBLIC_GA_ID: G-PLACEHOLDER
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: placeholder
          NEXT_PUBLIC_WHATSAPP_NUMBER: "91XXXXXXXXXX"

      - name: Lint
        run: npx next lint --max-warnings 0 || true

  lint-signaling:
    name: Lint (Signaling)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: signaling/package-lock.json
      - run: npm ci
      - run: node --check server.js

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-signaling]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder
            NEXT_PUBLIC_SIGNALING_URL=http://localhost:4000
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
            NEXT_PUBLIC_TURN_URL=turn:localhost:3478
            NEXT_PUBLIC_TURN_USERNAME=placeholder
            NEXT_PUBLIC_TURN_CREDENTIAL=placeholder
            NEXT_PUBLIC_R2_PUBLIC_URL=http://localhost
            NEXT_PUBLIC_GA_ID=G-PLACEHOLDER
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=placeholder
            NEXT_PUBLIC_WHATSAPP_NUMBER=91XXXXXXXXXX
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build signaling image
        uses: docker/build-push-action@v5
        with:
          context: ./signaling
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
